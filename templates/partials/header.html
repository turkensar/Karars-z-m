<header class="top-bar">
    <div class="top-bar-inner">
        <a href="{% url 'polls:feed' %}" class="brand">Kararsızım</a>
        <nav class="top-bar-nav">
            <a href="{% url 'polls:poll_create' %}" class="btn">Anket aç</a>
            {% if user.is_authenticated %}
                <a href="{% url 'polls:profile' user.username %}" class="username">@{{ user.username }}</a>
                <form action="{% url 'accounts:logout' %}" method="post" class="inline-form">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-ghost">Çıkış yap</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}">Giriş yap</a>
            {% endif %}
        </nav>
    </div>
</header>
